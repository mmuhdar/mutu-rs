# Menjalankan MutuRS beserta PostgreSQL 17 di server RS:
#   cp .env.example .env      (isi NAMA_RS, ganti POSTGRES_PASSWORD)
#   docker compose up -d --build
# Migrasi database berjalan otomatis saat aplikasi mulai. Petunjuk lengkap, termasuk backup dan pemulihan: INSTALASI.md.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mutu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Atur POSTGRES_PASSWORD di .env}
      POSTGRES_DB: mutu
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mutu -d mutu"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mutu:${POSTGRES_PASSWORD}@db:5432/mutu
      NAMA_RS: ${NAMA_RS:?Atur NAMA_RS di .env}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Makassar}
      # Jam lokal proses (log, format waktu) ikut zona waktu RS.
      TZ: ${APP_TIMEZONE:-Asia/Makassar}
    ports:
      - "${APP_PORT:-3000}:3000"

  # Dump database tiap hari pukul 01.00 waktu RS ke folder BACKUP_DIR, disimpan 30 hari (scripts/backup.sh).
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${APP_TIMEZONE:-Asia/Makassar}
      PGHOST: db
      PGUSER: mutu
      PGDATABASE: mutu
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${BACKUP_DIR:-./backup}:/backup
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["sh", "-c", "echo '0 1 * * * /usr/local/bin/backup.sh' | crontab - && exec crond -f -d 8"]

volumes:
  pgdata:
